name: Publish puzzle site
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and audit
        run: |
          python -m unittest discover -s word-kanji/tests -v
          python word-kanji/scripts/audit_public.py
      - uses: actions/configure-pages@v5
        id: pages
      - name: Package public files
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python word-kanji/scripts/build_site.py --output "$RUNNER_TEMP/puzzle-site" --base-path "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/puzzle-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
