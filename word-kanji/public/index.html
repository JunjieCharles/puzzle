<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <title>中文和同101</title>
  <link rel="icon" type="image/svg+xml" href="./coin.svg?v=green-1">
  <link rel="license" href="./NOTICE.txt">
  <script>
    // Canonical directory URL also works on hosts serving index.html without a redirect.
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('/index.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <div class="utility-actions">
    <button id="save-open" class="help-button" type="button" aria-label="导入导出存档" aria-haspopup="dialog"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12l4 4v14H3V3h2Zm2 0v6h10V3M7 21v-8h10v8"/></svg></button>
    <button id="help-open" class="help-button" type="button" aria-label="玩法帮助" aria-haspopup="dialog"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 8a4 4 0 0 1 8 0c0 3-4 3-4 6"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg></button>
    </div>
    <section id="home" class="view" aria-labelledby="home-title">
      <header class="home-brand"><img class="brand-mark" src="./coin.svg" width="80" height="80" alt=""><span>中文和同101</span></header>
      <div class="heading"><h1 id="home-title" tabindex="-1">选择模式</h1></div>
      <div class="choices">
        <a class="choice" href="#types"><span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V3m0 1c5-4 9 4 14 0v10c-5 4-9-4-14 0"/></svg></span><span class="choice-label">闯关模式</span><svg class="choice-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></a>
        <button class="choice" disabled><span class="choice-icon" aria-hidden="true">∞</span><span class="choice-label">无尽模式</span><span class="badge">未开放</span></button>
      </div>
    </section>
    <section id="types" class="view" hidden aria-labelledby="types-title">
      <a class="back" href="#home" aria-label="&#36820;&#22238;&#39318;&#39029;"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a>
      <div class="heading"><span class="eyebrow">闯关模式</span><h1 id="types-title" tabindex="-1">选择题型</h1></div>
      <div class="choices">
        <a class="choice" id="start" href="#levels"><span class="choice-icon type-icon" aria-hidden="true"><img src="./one-standard.svg" alt=""></span><span class="choice-label">一字标准型<small id="saved-progress"></small></span><svg class="choice-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></a>
        <a class="choice" id="start-two" href="#levels-two"><span class="choice-icon type-icon" aria-hidden="true"><img src="./two-standard.svg" alt=""></span><span class="choice-label">二字标准型<small id="saved-progress-two"></small></span><span class="choice-arrow" aria-hidden="true">→</span></a>
      </div>
    </section>
    <section id="levels" class="view" hidden aria-labelledby="levels-title">
      <div class="view-top">
      <a class="back" href="#types" aria-label="&#36820;&#22238;&#39064;&#22411;"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a>
      <div class="play-heading"><div><span class="eyebrow mode-label">一字标准型</span><h1 id="levels-title" tabindex="-1">选择关卡</h1></div><span id="levels-count" class="level-count"></span></div>
      </div>
      <div id="level-grid" class="level-grid" role="group" aria-label="关卡"></div>
      <nav id="level-pages" class="level-pages" aria-label="关卡分页" hidden><button id="page-previous" type="button">← 上一页</button><select id="page-select" aria-label="关卡范围"></select><button id="page-next" type="button">下一页 →</button></nav>
      <p id="levels-status" role="status"></p><button id="levels-retry" class="primary" type="button" hidden>重试</button>
    </section>
    <section id="play" class="view" hidden aria-labelledby="level-title">
      <div class="view-top">
      <a class="back" href="#levels" aria-label="&#36820;&#22238;&#36873;&#20851;"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a>
      <div class="play-heading"><div><span class="eyebrow mode-label">一字标准型</span><h1 id="level-title" tabindex="-1">加载中…</h1></div><span id="level-count" class="level-count"></span></div>
      </div>
      <progress id="progress" value="0" max="1" aria-label="闯关进度"></progress>
      <form id="puzzle-form" autocomplete="off">
        <div id="board" class="board" role="group" aria-label="一字标准型题目">
          <span id="top" class="clue top"></span><span class="arrow down-one" aria-label="向下">↓</span>
          <span id="left" class="clue left"></span><span class="arrow right-one" aria-label="向右">→</span>
          <input id="entry" class="entry" type="text" aria-label="填入一个汉字" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" disabled>
          <span class="arrow right-two" aria-label="向右">→</span><span id="right" class="clue right"></span>
          <span class="arrow down-two" aria-label="向下">↓</span><span id="bottom" class="clue bottom"></span>
          <span id="top-two" class="clue top-two two-cell" hidden></span><span class="arrow down-three two-cell" aria-label="向下" hidden>↓</span>
          <input id="entry-two" class="entry second-entry two-cell" type="text" aria-label="第二个字" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" hidden disabled>
          <span class="arrow right-three two-cell" aria-label="向右" hidden>→</span>
          <span class="arrow down-four two-cell" aria-label="向下" hidden>↓</span><span id="bottom-two" class="clue bottom-two two-cell" hidden></span>
        </div>
        <div class="answer-actions">
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <button id="submit" class="primary" type="submit" disabled>提交</button>
        <div id="next" class="advance-indicator" aria-hidden="true" hidden><span></span></div>
        <button id="retry" class="primary" type="button" hidden>重试</button>
        </div>
      </form>
      <nav class="level-nav" aria-label="关卡导航"><button id="previous" type="button" disabled>← 上一关</button><button id="reveal" type="button" hidden>查看答案</button><button id="hide-answer" type="button" hidden>隐藏答案</button><button id="review-next" type="button" hidden>下一关 →</button></nav>
    </section>
    <section id="complete" class="view" hidden aria-labelledby="complete-title">
      <a class="back" href="#levels" aria-label="&#36820;&#22238;&#36873;&#20851;"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a>
      <div class="complete-panel">
        <svg class="complete-medal" aria-hidden="true" viewBox="0 0 160 140" fill="none">
          <circle cx="80" cy="65" r="44" fill="#e2edd8" stroke="#9eb898" stroke-width="2"/>
          <circle cx="80" cy="65" r="34" fill="#285c49"/>
          <path d="m64 65 11 11 22-24" stroke="#fffef7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 111C9 96 10 56 23 35M120 111c31-15 30-55 17-76" stroke="#789871" stroke-width="3" stroke-linecap="round"/>
          <path d="M25 88Q4 85 7 66q17 1 18 22M21 62Q5 49 15 36q14 8 6 26M35 106Q14 111 11 94q17-7 24 12M135 88q21-3 18-22-17 1-18 22M139 62q16-13 6-26-14 8-6 26M125 106q21 5 24-12-17-7-24 12" fill="#a4bd97"/>
          <path d="m80 3 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#789871"/>
        </svg>
        <span class="eyebrow mode-label">一字标准型</span>
        <h1 id="complete-title" tabindex="-1">恭喜，全部通关！</h1>
        <p id="complete-count" class="level-count"></p>
      </div>
    </section>
  </main>
  <div id="save-warning" class="save-warning" role="status" hidden><span>进度尚未保存，请导出存档</span><button id="warning-export" type="button">导出存档</button></div>
  <dialog id="save-dialog" aria-labelledby="save-title">
    <form method="dialog" class="help-heading"><h2 id="save-title">存档</h2><button class="help-close" aria-label="关闭存档"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></form>
    <label for="save-code">复制存档码，或粘贴后导入。</label>
    <textarea id="save-code" rows="5" maxlength="65536" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="存档码"></textarea>
    <div class="save-actions"><button id="save-export" class="primary" type="button">导出并复制</button><button id="save-import" class="primary" type="button">导入存档</button></div>
    <p id="save-status" role="status" aria-live="polite"></p>
  </dialog>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <form method="dialog" class="help-heading"><h2 id="help-title">怎么玩</h2><button class="help-close" aria-label="关闭帮助"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></form>
    <p>一字型填一个字；二字型从左到右填成一个二字词，可以直接输入整个词。顺着每条箭头读，都要组成词语。</p>
    <div class="help-example" role="img" aria-label="例题：上方回、左方报、下方应、右方案，中间填答。箭头向右、向下。">
      <span class="top">回</span><span class="down-one help-arrow">↓</span>
      <span class="left">报</span><span class="right-one help-arrow">→</span>
      <span class="help-answer">答</span><span class="right-two help-arrow">→</span><span class="right">案</span>
      <span class="down-two help-arrow">↓</span><span class="bottom">应</span>
    </div>
    <p class="help-words">回答 · 报答 · 答案 · 答应</p>
    <p>上面是一字型示例。二字型还要让中间两字按顺序成词，所有箭头组词都成立。</p>
  </dialog>
</body>
</html>
