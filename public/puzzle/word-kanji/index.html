<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <title>和同開珎</title>
  <link rel="license" href="./NOTICE.txt">
  <script>
    // Canonical directory URL also works on hosts serving index.html without a redirect.
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('/index.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="和同開珎首页"><span class="brand-mark" aria-hidden="true">同</span>和同開珎</a>
      <span class="header-tag">字谜</span>
    </header>
    <section id="home" class="view" aria-labelledby="home-title">
      <div class="heading"><span class="eyebrow">和同開珎</span><h1 id="home-title" tabindex="-1">选择模式</h1></div>
      <div class="choices">
        <a class="choice" href="#types"><span class="choice-icon" aria-hidden="true">⌑</span><span class="choice-label">闯关模式</span><span class="choice-arrow" aria-hidden="true">↗</span></a>
        <button class="choice" disabled><span class="choice-icon" aria-hidden="true">∞</span><span class="choice-label">无尽模式</span><span class="badge">未开放</span></button>
      </div>
    </section>
    <section id="types" class="view" hidden aria-labelledby="types-title">
      <a class="back" href="#home">← 返回</a>
      <div class="heading"><span class="eyebrow">闯关模式</span><h1 id="types-title" tabindex="-1">选择题型</h1></div>
      <div class="choices">
        <a class="choice" id="start" href="#play"><span class="choice-icon type-icon" aria-hidden="true">一</span><span class="choice-label">一字标准型<small id="saved-progress"></small></span><span class="choice-arrow" aria-hidden="true">↗</span></a>
        <button class="choice" disabled><span class="choice-icon type-icon" aria-hidden="true">二</span><span class="choice-label">二字标准型</span><span class="badge">未开放</span></button>
      </div>
    </section>
    <section id="play" class="view" hidden aria-labelledby="level-title">
      <a class="back" href="#types">← 返回</a>
      <div class="play-heading"><div><span class="eyebrow">一字标准型</span><h1 id="level-title" tabindex="-1">加载中…</h1></div><span id="level-count" class="level-count"></span></div>
      <progress id="progress" value="0" max="1" aria-label="闯关进度"></progress>
      <form id="puzzle-form" autocomplete="off">
        <div class="board" role="group" aria-label="一字标准型题目">
          <span id="top" class="clue top"></span><span class="arrow down-one" aria-label="向下">↓</span>
          <span id="left" class="clue left"></span><span class="arrow right-one" aria-label="向右">→</span>
          <input id="entry" class="entry" type="text" aria-label="填入一个汉字" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" disabled>
          <span class="arrow right-two" aria-label="向右">→</span><span id="right" class="clue right"></span>
          <span class="arrow down-two" aria-label="向下">↓</span><span id="bottom" class="clue bottom"></span>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <button id="submit" class="primary" type="submit" disabled>提交</button>
        <button id="next" class="primary" type="button" hidden>下一关 →</button>
        <button id="retry" class="primary" type="button" hidden>重试</button>
      </form>
      <nav class="level-nav" aria-label="关卡导航"><button id="previous" type="button" disabled>← 上一关</button><button id="resume" type="button" hidden>继续闯关 →</button></nav>
    </section>
    <section id="complete" class="view" hidden aria-labelledby="complete-title"><div class="heading"><span class="eyebrow">一字标准型</span><h1 id="complete-title" tabindex="-1">全部通关</h1><p id="complete-count" class="level-count"></p></div><a class="primary" href="#types">返回题型</a><button id="replay" class="text-button" type="button">再玩一次</button></section>
  </main>
</body>
</html>
